<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <button class="btn btn-primary rounded-circle">Bouton</button>
        <input type="submit" class="btn btn-success" value="Ajouter">
        <input type="reset" class="btn btn-outline-danger" value="Annuler">
        <input type="button" class="btn btn-outline-warning rounded-pill" value="Click me">
        <a href="" class="btn btn-info text-white">Page d'accueil</a>
        <span class="btn text-white" style="background: purple">Click</span>

        <span class="badge bg-success">3</span>
        <a href="" class="btn btn-success"> 
            Notifications<span class="badge bg-danger">12</span>
        </a>

        <div class="alert alert-success">Message de success</div>
        <div class="alert alert-warning">message d'avertissement</div>
        <div class="alert alert-danger">message d'erreur</div>
       
        <div
            class="alert alert-primary"
            role="alert"
        >
            <strong>Alert Heading</strong> Some Word
        </div>

        <button
            type="button"
            class="btn btn-primary"
        >
            Button
        </button>

        
        
        <div
            class="alert alert-primary alert-dismissible fade show"
            role="alert"
        >
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
            ></button>
        
            <strong>Holy guacamole!</strong> You should check in on some of
            those fields below.
        </div>

        <span
            class="badge bg-primary"
            >New!</span
        >
        
        
        
    </div>

  
    

    <script src="bootstrap.bundle.min.js"></script>
</body>
</html>
