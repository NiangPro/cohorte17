<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Vos coordonnees</legend>
            <table>
                <tr>
                    <td><label for="">Nom:</label></td>
                    <td><input type="text" placeholder="Votre nom"></td>
                </tr>
                <tr>
                    <td><label for="">Prenom: </label></td>
                    <td><input type="text" placeholder="votre prenom"></td>
                </tr>
                <tr>
                    <td><label for="">Date de naissance:</label></td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td><label for="">Mail:</label></td>
                    <td><input type="email" placeholder="votre mail"></td>
                </tr>
                <tr>
                    <td><label for="">Votre site:</label></td>
                    <td><input type="url"></td>
                </tr>
                <tr>
                    <td><label for="">Code</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Genre:</label></td>
                    <td>
                        <input type="radio" name="genre">Homme <br>
                        <input type="radio" name="genre">Femme
                    </td>
                </tr>
                <tr>
                    <td><label for="">Pays:</label></td>
                    <td>
                        <select name="" id="">
                            <option value="">Votre pays</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
        <fieldset>
            <legend>Vos gouts</legend>
            <input type="checkbox"> Tarte aux fraises a la creme d'amandes
            <br><input type="checkbox"> Tarte aux prunes
            <br><input type="checkbox"> Tarte rustique aux mirabelles de lorraine, noisettes et miel 
            <br>
            <textarea name="" cols="50" rows="5" placeholder="Decrivez vos gouts en detail" id=""></textarea>

        </fieldset>
        <fieldset>
            <legend>Envoyez nous votre photo</legend>
            <input type="file"><br><br>
            <input type="reset" value="Effacer">&nbsp;&nbsp;&nbsp;
            <input type="submit" value="Envoyer">
        </fieldset> 
    </form>
</body>
</html>
