<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="">
        <!-- premiere ligne -->
        <tr>
            <td rowspan="2" colspan="2" height="75">

            </td>

                <img src="../images/bg.jpg" height="40" width="250" alt="">

        <!-- deuxieme ligne -->

            <td colspan="2" rowspan="2">

                    <li>Langages</li>

        <!-- quatrieme ligne -->
        <tr>
            <td rowspan="2" bgcolor="red">Rouge</td>
            <td rowspan="2" colspan="2">

        <tr>
            <td bgcolor="green">Vert</td>
            <td bgcolor="orange">Orange</td>
        </tr>
    </table>

</html>
