<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            font-size: 54px;
            color: brown;
        }

        @media (max-width: 400px){
            h1{
                color: yellow;
                font-size: 12px;
            }
        }

        @media (min-width:401px) AND (max-width: 700px){
            h1{
                font-size: 24px;
                color: black;
            }
        }
    </style>
</head>
<body>
    <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Culpa praesentium accusantium reiciendis pariatur ipsa deserunt.</h1>
</body>
</html>
