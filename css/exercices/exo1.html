<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #el1{
            border: 10px groove brown;
            width: 200px;
            margin-left: 75px;
            padding: 20px;
            font-size: 34px;
            color: brown;
            text-shadow: 1px 1px 1px #000;
            margin-bottom: 50px;
        }

        #el2{
            width: 150px;
            box-shadow: 3px 3px 5px red, -3px -3px 5px red;
            padding: 10px;
            text-align: center;
            font-family: algerian;
            border-bottom-right-radius: 25px;
            text-shadow: 2px  2px 5px red;
        }

        #el2:hover{
            transition: 3s;
            border-bottom-right-radius: 0px;
            box-shadow: inset -3px -3px 5px purple;
            transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div id="el1">les modeles de boites</div>
    <div id="el2">transformation</div>
</body>
</html>
